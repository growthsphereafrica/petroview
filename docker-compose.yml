services:
  backend:
    build: ./backend
    container_name: masterview-backend
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DB_PATH=/app/data/masterview.sqlite
      # Optional. When set, the value becomes the platform admin credential and
      # is re-applied on every boot. When unset, an existing account is left
      # untouched and a first-time deployment generates a strong random PIN and
      # prints it once to the boot log. Either way no known default ships.
      - SUPER_ADMIN_PIN=${SUPER_ADMIN_PIN:-}
      - SEED_DEMO_DATA=false
      - ENABLE_DESTRUCTIVE_OPERATIONS=false
      - CORS_ORIGINS=${CORS_ORIGINS:-}
      - PRICE_TOLERANCE_GHS=${PRICE_TOLERANCE_GHS:-0.01}
      - PIN_KDF_ITERATIONS=${PIN_KDF_ITERATIONS:-}
    # Bound to loopback. This container has no TLS of its own, so publishing
    # 4000 on all interfaces would expose PINs over plaintext and bypass the
    # reverse proxy. Put a TLS terminator in front, or forward to it explicitly.
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - masterview-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  masterview-data:
