server {
    listen 80;
    server_name _;

    # Do not advertise the exact nginx build.
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. Traefik terminates TLS in front of this container, so
    # these are the only ones the browser sees for the app itself. Declared at
    # server level: nginx drops inherited add_header directives inside any
    # location that declares its own, so none of the locations below may add
    # headers without repeating these.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # No Content-Security-Policy on purpose. The dashboard pulls webfonts from
    # fonts.googleapis.com/fonts.gstatic.com and Tailwind emits inline styles;
    # a policy wrong in either direction either white-screens every station or
    # buys nothing over the headers above. Add one only alongside a full pass
    # over every screen, not blind.

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    # The shell must never be cached. It points at content-hashed bundles, so a
    # cached index.html after a deploy makes clients request bundles that no
    # longer exist.
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Single Page Application routing fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames under /assets, so these are safe to
    # cache for a year.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Everything else that is a static file: cache, but never let a missing file
    # silently fall through to the SPA shell with a 200.
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Unused in the current build; Dokploy health probes this path.
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }
}
